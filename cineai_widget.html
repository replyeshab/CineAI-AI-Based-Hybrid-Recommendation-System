<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CineAI</title>
<style>
:root{--bg:#fff;--fg:#1a1a2e;--mut:#6b7280;--card:#f5f6fb;--bd:#e2e5ef;--acc:#4f46e5;--pos:#16a34a;--neg:#dc2626}
@media (prefers-color-scheme:dark){:root{--bg:#0f1117;--fg:#e8eaf2;--mut:#9aa3b5;--card:#181b25;--bd:#2a2f3d;--acc:#8b86ff;--pos:#4ade80;--neg:#f87171}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
h1{margin:0;font-size:24px}h2{font-size:17px;margin:28px 0 10px}
.banner{background:var(--card);border:1px dashed var(--bd);border-radius:10px;padding:8px 12px;color:var(--mut);font-size:13px;margin-top:10px}
.meter{flex:1;min-width:240px;max-width:380px}.meter small{color:var(--mut)}
.track{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin-top:4px}.track>i{display:block;height:100%;background:var(--acc);transition:width .3s}
input[type=search]{width:100%;padding:11px 14px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--fg);font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--fg);padding:5px 11px;border-radius:99px;cursor:pointer;font-size:13px}
.chip[aria-pressed=true]{background:var(--acc);border-color:var(--acc);color:#fff}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.poster{height:96px;display:flex;align-items:center;justify-content:center;position:relative;color:#fff;font-size:30px;font-weight:700;letter-spacing:2px}
.badge{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.55);font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;letter-spacing:0}
.card h3{margin:10px 12px 0;font-size:15px}.card h3 small{color:var(--mut);font-weight:400}
.g{margin:2px 12px 6px;color:var(--mut);font-size:12.5px}
.stars{margin:0 8px 8px}.stars button{border:0;background:none;font-size:20px;color:var(--bd);cursor:pointer;padding:0 1px}.stars button.on{color:#f5a623}
.why{margin:auto 12px 12px;border:1px solid var(--acc);color:var(--acc);background:none;border-radius:8px;padding:6px;cursor:pointer;font-size:13px}
.expl{border-top:1px solid var(--bd);padding:10px 12px;font-size:13px}.expl ul{margin:0 0 8px;padding-left:18px}.expl .b{color:var(--acc);margin-bottom:6px}
.row{display:grid;grid-template-columns:92px 1fr 38px;gap:6px;align-items:center;font-size:11.5px;margin:3px 0;color:var(--mut)}
.row .tr{height:7px;background:var(--bd);border-radius:4px;overflow:hidden;margin:0}.row i{display:block;height:100%}.row i.pos{background:var(--pos)}.row i.neg{background:var(--neg)}.row em{font-style:normal;text-align:right}
.note{font-size:11px;color:var(--mut);margin-top:6px}.err{color:var(--neg)}
</style></head><body><div class="wrap">
<header><h1>🎬 CineAI</h1>
<div class="meter"><small id="stage"></small><div class="track"><i id="bar" style="width:0"></i></div></div></header>
<div id="banner" class="banner" hidden></div>

<h2>1 · What are you in the mood for?</h2>
<input type="search" id="q" placeholder="Describe a mood or search a title, then press Enter (e.g. “slow-burn space thriller”)">
<div class="chips" id="chips" aria-label="Favourite genres"></div>

<h2 id="rateTitle">2 · Rate a few movies you know <small style="color:var(--mut);font-weight:400">— every rating sharpens your picks</small></h2>
<div class="grid" id="rate"></div>

<h2>3 · Recommended for you</h2>
<div id="msg" class="note"></div>
<div class="grid" id="recs"></div>
</div>
<script>
const API_URL = "https://bodies-quarterly-polymer-tide.trycloudflare.com";            // ← your tunnel/server URL, no trailing slash. Empty = demo mode with sample data.
const GROUPS = ["Your genre taste","Similar to what you liked","People with similar taste","Community rating","Era & profile fit"];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const S = {ratings:{}, genres:new Set(), items:{}, query:"", recs:[]};
try { Object.assign(S.ratings, JSON.parse(localStorage.getItem("cineai") || "{}")); } catch(e) {}
const save = () => { try { localStorage.setItem("cineai", JSON.stringify(S.ratings)); } catch(e) {} };

/* ---------- demo data (only used when API_URL is empty) ---------- */
const M = (id,t,y,g) => ({movieId:id,title:t,year:y,genres:g.split("|")});
const D_ONB = [M(1,"Toy Story",1995,"Animation|Comedy"),M(2,"The Matrix",1999,"Action|Sci-Fi"),M(3,"Pulp Fiction",1994,"Crime|Drama"),M(4,"The Shining",1980,"Horror"),
 M(5,"Titanic",1997,"Drama|Romance"),M(6,"Forrest Gump",1994,"Comedy|Drama"),M(7,"Alien",1979,"Horror|Sci-Fi"),M(8,"Spirited Away",2001,"Animation|Fantasy"),
 M(9,"The Dark Knight",2008,"Action|Crime"),M(10,"Amelie",2001,"Comedy|Romance"),M(11,"Fargo",1996,"Comedy|Crime"),M(12,"Gladiator",2000,"Action|Drama")];
const D_REC = [[M(101,"Blade Runner",1982,"Sci-Fi|Thriller"),[.45,.6,.3,.2,.1]],[M(102,"Heat",1995,"Action|Crime"),[.4,.25,.5,.3,-.05]],[M(103,"Princess Mononoke",1997,"Animation|Fantasy"),[.2,.5,.35,.3,.05]],
 [M(104,"Se7en",1995,"Crime|Thriller"),[.3,.2,.55,.4,-.1]],[M(105,"Moon",2009,"Sci-Fi|Drama"),[.35,.55,.1,-.05,.15]],[M(106,"Parasite",2019,"Comedy|Thriller"),[.1,.15,.4,.6,.2]]];
const D_TXT = ["You tend to rate these genres highly","Close in style to movies you rated highly","Viewers whose ratings resemble yours loved it","Highly rated by the community","Fits your taste for this era"];
function demo(path, body){
  if (path === "/meta") return {genres:["Action","Animation","Comedy","Crime","Drama","Fantasy","Horror","Romance","Sci-Fi","Thriller"]};
  if (path.startsWith("/onboarding")) return {items:D_ONB};
  if (path.startsWith("/search")) return {items:D_ONB.filter(m => (m.title+m.genres).toLowerCase().includes(decodeURIComponent(path.split("q=")[1]).split("&")[0].toLowerCase().split(" ")[0]))};
  const h = body.history, top = h.slice().sort((a,b)=>b.rating-a.rating)[0];
  return {items: D_REC.map(([m,c],i) => {
    const pos = c.map((v,j)=>[j,v]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,2);
    return {...m, score:1, match: h.length ? 92-i*4 : null, mode: h.length ? "personalized" : "cold-start",
      reasons: pos.map(([j,v]) => ({group:GROUPS[j], text:D_TXT[j], impact:v})),
      because: top ? {movieId:top.movieId, title:S.items[top.movieId]?.title || "a movie you rated"} : null,
      contributions: GROUPS.map((g,j)=>({group:g, value: h.length ? c[j] : (j==3?1:0)}))};
  })};
}
async function api(path, body){
  if (!API_URL) return demo(path, body);
  const r = await fetch(API_URL + path, body ? {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)} : undefined);
  if (!r.ok) throw new Error("API " + r.status); return r.json();
}

/* ---------- rendering ---------- */
const hue = g => { let h = 0; for (const c of (g||"x")) h = (h*31 + c.charCodeAt(0)) % 360; return `linear-gradient(135deg,hsl(${h} 55% 42%),hsl(${(h+50)%360} 60% 32%))`; };
const ini = t => t.replace(/^(The|A|An) /,"").split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase();
const stars = id => [1,2,3,4,5].map(n => `<button data-id="${id}" data-star="${n}" class="${(S.ratings[id]||0)>=n?"on":""}" aria-label="${n} stars">★</button>`).join("");
function card(m, withWhy){
  S.items[m.movieId] = m;
  let why = "";
  if (withWhy && m.reasons) {
    const mx = Math.max(.001, ...m.contributions.map(c => Math.abs(c.value)));
    why = `<button class="why" aria-expanded="false">Why this?</button><div class="expl" hidden>
      ${m.because ? `<div class="b">Because you liked <b>${esc(m.because.title)}</b></div>` : ""}
      <ul>${m.reasons.map(r => `<li>${esc(r.text)}</li>`).join("")}</ul>
      ${m.contributions.map(c => `<div class="row"><span>${esc(c.group)}</span><div class="tr"><i class="${c.value<0?"neg":"pos"}" style="width:${Math.abs(c.value)/mx*100}%"></i></div><em>${c.value>0?"+":""}${c.value.toFixed(2)}</em></div>`).join("")}
      <div class="note">Bars are exact SHAP contributions of the ranking model (green pushes up, red pushes down).</div></div>`;
  }
  const badge = withWhy ? `<b class="badge">${m.match == null ? "Popular pick" : m.match + "% match"}</b>` : "";
  return `<article class="card"><div class="poster" style="background:${hue(m.genres[0])}">${esc(ini(m.title))}${badge}</div>
    <h3>${esc(m.title)} <small>${m.year || ""}</small></h3><p class="g">${m.genres.map(esc).join(" · ")}</p>
    <div class="stars">${stars(m.movieId)}</div>${why}</article>`;
}
const rated = () => Object.entries(S.ratings).map(([id, r]) => ({movieId:+id, rating:r}));
function meter(){
  const n = rated().length;
  $("#bar").style.width = Math.min(n, 10) * 10 + "%";
  $("#stage").textContent = n < 3 ? `${n} rating${n==1?"":"s"} · cold start — showing popular picks` : n < 10 ? `${n} ratings · learning your taste` : `${n} ratings · fully personalised`;
}
function setRate(items){ $("#rate").innerHTML = items.map(m => card(m, false)).join(""); }
async function refresh(){
  meter(); $("#msg").textContent = "Loading…"; $("#msg").className = "note";
  try {
    const r = await api("/recommend", {history:rated(), genres:[...S.genres], query:S.query || null, top_n:12});
    S.recs = r.items; $("#recs").innerHTML = r.items.map(m => card(m, true)).join(""); $("#msg").textContent = "";
  } catch(e) { $("#msg").textContent = "Couldn't reach the API (" + e.message + ")."; $("#msg").className = "note err"; }
}
let t; const later = () => { clearTimeout(t); t = setTimeout(refresh, 350); };

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const s = e.target.closest("[data-star]");
  if (s) { const id = s.dataset.id, n = +s.dataset.star;
    if (S.ratings[id] === n) delete S.ratings[id]; else S.ratings[id] = n;
    save(); document.querySelectorAll(`.stars [data-id="${id}"]`).forEach(b => b.classList.toggle("on", (S.ratings[id]||0) >= +b.dataset.star)); meter(); later(); return; }
  const w = e.target.closest(".why");
  if (w) { const p = w.nextElementSibling, open = p.hidden; p.hidden = !open; w.setAttribute("aria-expanded", open); w.textContent = open ? "Hide" : "Why this?"; }
});
$("#q").addEventListener("keydown", async e => {
  if (e.key !== "Enter") return;
  S.query = e.target.value.trim();
  try {
    if (S.query) { const r = await api("/search?q=" + encodeURIComponent(S.query) + "&n=12"); setRate(r.items); }
    else setRate((await api("/onboarding?n=12")).items);
  } catch(err) { $("#msg").textContent = err.message; }
  refresh();
});
(async () => {
  if (!API_URL) { const b = $("#banner"); b.hidden = false; b.textContent = "Demo mode: sample data and canned explanations. Set API_URL in the script to connect your trained model."; }
  try {
    const m = await api("/meta");
    $("#chips").innerHTML = m.genres.map(g => `<button class="chip" aria-pressed="false">${esc(g)}</button>`).join("");
    $("#chips").addEventListener("click", e => { const c = e.target.closest(".chip"); if (!c) return;
      const on = c.getAttribute("aria-pressed") !== "true"; c.setAttribute("aria-pressed", on); on ? S.genres.add(c.textContent) : S.genres.delete(c.textContent); later(); });
    setRate((await api("/onboarding?n=12")).items);
  } catch(e) { $("#msg").textContent = "Couldn't reach the API (" + e.message + ")."; $("#msg").className = "note err"; }
  refresh();
})();
</script></body></html>
